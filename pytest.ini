[pytest]
norecursedirs =
    snapshots
    backups
    docs_raw_backup
markers =
    slow: long-running integration tests (opt-out with -m "not slow")
filterwarnings =
    # Temporary: silence sklearn persistence version noise while caches self-heal; remove after v2.3 rollout.
    ignore::sklearn.base.InconsistentVersionWarning
    # PendingDeprecationWarning from starlette form parsers importing python-multipart.
    ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning
