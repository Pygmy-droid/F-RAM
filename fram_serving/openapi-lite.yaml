openapi: 3.0.0
info:
  title: F-RAM v2.2 Starter
  version: "0.0.1"
servers:
  # This gets replaced by scripts/set_public_url.ps1
  - url: https://REPLACE_ME_PUBLIC_URL
paths:
  /mcp/fram_query:
    post:
      summary: Run F-RAM query
      parameters:
        - name: X-API-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:   { type: string }
                as_of:  { type: string, nullable: true }
                version_id: { type: string, nullable: true }
                budget: { type: integer, nullable: true }
      responses:
        "200": { description: ok, content: { application/json: {} } }
  /mcp/trace/{id}:
    get:
      summary: Get saved trace by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-API-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        "200": { description: ok, content: { application/json: {} } }
  /mcp/label:
    post:
      summary: Submit label for reliability
      parameters:
        - name: X-API-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, hit]
              properties:
                id:  { type: string }
                hit: { type: boolean }
      responses:
        "200": { description: ok, content: { application/json: {} } }
  /metrics:
    get:
      summary: Live reliability & alarms
      responses:
        "200": { description: ok, content: { application/json: {} } }
  /health:
    get:
      summary: Health
      responses:
        "200": { description: ok, content: { application/json: {} } }
